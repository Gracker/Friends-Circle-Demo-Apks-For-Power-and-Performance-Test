plugins {
    id 'convention.android-app'
}

android {
    namespace 'com.example.wechatfriendforwebviewsurface'

    defaultConfig {
        applicationId "com.example.wechatfriendforwebviewsurface"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // GeckoView 需要 NDK 支持
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':load-config')
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview

    // 使用基础 Activity，GeckoView 需要 lifecycle 依赖 (不含 lifecycle-process 避免冲突)
    implementation libs.annotation
    implementation libs.lifecycle.runtime
    implementation libs.lifecycle.common
    implementation libs.core

    // GeckoView - Mozilla Firefox 引擎 (排除传递依赖避免冲突)
    implementation(libs.geckoview) {
        exclude group: 'androidx.lifecycle'
        exclude group: 'androidx.startup'
    }

    // Glide图片加载
    implementation libs.glide

    // 导入RxJava
    implementation libs.rxjava
    implementation libs.rxandroid

    testImplementation libs.junit
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.espresso.core
}
