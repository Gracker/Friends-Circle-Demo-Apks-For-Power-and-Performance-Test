# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=jks -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Djsse.enableSNIExtension=true
# AndroidX package structure
android.useAndroidX=true
# Jetifier removed - all dependencies are already AndroidX
# android.enableJetifier=true
# Suppress Java source/target deprecation warning
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# Enable parallel builds
org.gradle.parallel=true
# Enable build caching
org.gradle.caching=true
# Enable configuration cache for faster builds
org.gradle.configuration-cache=true
# Worker threads
org.gradle.workers.max=8
# Allow modules to access library resources through their own R class
android.nonTransitiveRClass=false
