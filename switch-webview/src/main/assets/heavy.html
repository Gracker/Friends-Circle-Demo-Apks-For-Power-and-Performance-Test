<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Load</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { text-align: center; font-size: 1.2em; }
        .container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        .item {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            position: relative;
        }
        .status { text-align: center; margin-top: 10px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 8px; font-size: 12px; }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1));
            border-radius: 4px;
        }
        .badge {
            position: absolute;
            top: -2px; right: -2px;
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Heavy Load (300 Elements)</h1>
    <div class="container" id="container"></div>
    <div class="status" id="status">Loading...</div>
    <script>
        // HEAVY LOAD - 目标 ~700-1200ms 延迟
        // 300 个 DOM 元素，每个 300,000 次计算 = 90,000,000 总操作
        const container = document.getElementById('container');
        const startTime = performance.now();

        // Complex data structures
        const dataTree = {};
        const sortedArrays = [];
        const hashMaps = [];
        const matrixCache = [];

        // Bessel function approximation
        function besselJ0(x) {
            if (Math.abs(x) < 8.0) {
                const y = x * x;
                return (79.78 - y * (0.000077 * y - 0.55274)) /
                       (79.78 + y * (2.18 + y * (0.92 + y * 0.267)));
            } else {
                const z = 8.0 / x;
                const y = z * z;
                return Math.sqrt(0.636 / Math.abs(x)) *
                       Math.cos(Math.abs(x) - 0.785 + y * (-0.055 + y * 0.0043));
            }
        }

        // 4x4 Matrix multiplication
        function multiplyMatrix(a, b) {
            const result = [];
            for (let i = 0; i < a.length; i++) {
                result[i] = [];
                for (let j = 0; j < b[0].length; j++) {
                    result[i][j] = 0;
                    for (let k = 0; k < a[0].length; k++) {
                        result[i][j] += a[i][k] * b[k][j];
                    }
                }
            }
            return result;
        }

        // Complex math function with multiple iterations
        function heavyMath(x, iterations) {
            let result = x;
            for (let i = 0; i < iterations; i++) {
                result = Math.sin(result) * Math.cos(result) + Math.sqrt(Math.abs(result)) + 0.1;
                result = result * result - Math.floor(result);
            }
            return Math.abs(result) * 1000;
        }

        // Create elements with VERY HEAVY computation
        for (let i = 0; i < 300; i++) {
            const item = document.createElement('div');
            item.className = 'item';
            item.textContent = (i + 1) % 100;

            // Add overlay
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            item.appendChild(overlay);

            // Add badge for some items
            if (i % 5 === 0) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                item.appendChild(badge);
            }

            // 300,000 次计算 per element
            let result = 0;

            // 1. Massive complex math loop
            for (let j = 0; j < 300000; j++) {
                result += Math.sin(j * 0.01 + i) * Math.sqrt(j + 1);
                result += Math.cos(j * 0.005 + i) * Math.sqrt(Math.abs(Math.sin(j * 0.001) * 1000));
                result += besselJ0(j * 0.0001 + result * 0.000001);
            }

            // 2. Additional heavy math
            result += heavyMath(i, 10000);

            // 3. 4x4 Matrix operations for EVERY item
            const matA = [[Math.random(), Math.random(), Math.random(), Math.random()],
                         [Math.random(), Math.random(), Math.random(), Math.random()],
                         [Math.random(), Math.random(), Math.random(), Math.random()],
                         [Math.random(), Math.random(), Math.random(), Math.random()]];
            const matB = [[Math.random(), Math.random(), Math.random(), Math.random()],
                         [Math.random(), Math.random(), Math.random(), Math.random()],
                         [Math.random(), Math.random(), Math.random(), Math.random()],
                         [Math.random(), Math.random(), Math.random(), Math.random()]];
            const matResult = multiplyMatrix(matA, matB);
            result += matResult[0][0] + matResult[1][1] + matResult[2][2] + matResult[3][3];
            matrixCache.push(matResult);

            // 4. Data structure operations - larger nested structures
            dataTree['node_' + i] = {
                id: i,
                value: result,
                children: [],
                metadata: {
                    timestamp: Date.now(),
                    computed: true,
                    nested: {
                        level1: { level2: { level3: { data: result * 1000 } } }
                    }
                }
            };

            // Create nested children (增加到 15)
            for (let c = 0; c < 15; c++) {
                dataTree['node_' + i].children.push({
                    id: `${i}_${c}`,
                    value: result * (c + 1),
                    grandchildren: Array(10).fill(null).map((_, g) => ({
                        id: `${i}_${c}_${g}`,
                        value: heavyMath(result, 20)
                    }))
                });
            }

            // 5. Array operations - larger arrays (增加到 300)
            const arr = [];
            for (let j = 0; j < 300; j++) {
                arr.push(Math.random() * 10000);
            }
            arr.sort((a, b) => a - b);
            sortedArrays.push(arr);

            // 6. Hash map operations (增加到 100)
            const map = {};
            for (let j = 0; j < 100; j++) {
                map['key_' + j] = { value: 'value_' + (j * i), nested: { data: heavyMath(j, 10) } };
            }
            hashMaps.push(map);

            // Apply computed styles
            const hue = (result % 360 + 360) % 360;
            const lightness = 40 + (i % 20);
            item.style.background = `hsla(${hue}, 70%, ${lightness}%, 0.4)`;

            container.appendChild(item);
        }

        // 搜索所有数组
        let searchCount = 0;
        for (const arr of sortedArrays) {
            const target = Math.random() * 10000;
            let left = 0, right = arr.length - 1;
            while (left <= right) {
                const mid = Math.floor((left + right) / 2);
                if (arr[mid] === target) {
                    searchCount++;
                    break;
                }
                if (arr[mid] < target) left = mid + 1;
                else right = mid - 1;
            }
        }

        // Reduce 操作
        const totalValue = Object.values(dataTree).reduce((sum, node) => sum + node.value, 0);
        const avgMatrixValue = matrixCache.reduce((sum, mat) => {
            return sum + mat.reduce((rowSum, row) => rowSum + row.reduce((cellSum, val) => cellSum + val, 0), 0);
        }, 0) / matrixCache.length;

        const endTime = performance.now();
        document.getElementById('status').textContent =
            'Loaded in ' + (endTime - startTime).toFixed(2) + 'ms | ' +
            'Elements: ' + container.children.length + ' | Data nodes: ' + Object.keys(dataTree).length +
            ' | Matrices: ' + matrixCache.length;
    </script>
</body>
</html>
