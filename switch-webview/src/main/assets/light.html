<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Load</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { text-align: center; }
        .container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .item {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .status { text-align: center; margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Light Load (50 Elements)</h1>
    <div class="container" id="container"></div>
    <div class="status" id="status">Loading...</div>
    <script>
        // LIGHT LOAD - 目标 ~100-200ms 延迟
        // 50 个 DOM 元素，每个 15,000 次计算 = 750,000 总操作
        const container = document.getElementById('container');
        const startTime = performance.now();

        // 创建数据结构
        const dataList = [];

        for (let i = 0; i < 50; i++) {
            const item = document.createElement('div');
            item.className = 'item';

            // 计算每个元素的属性
            let result = 0;

            // 15,000 次数学计算
            for (let j = 0; j < 15000; j++) {
                result += Math.sin(j * 0.01 + i) * Math.sqrt(j + 1);
                result += Math.cos(j * 0.005) * Math.sqrt(Math.abs(Math.sin(j * 0.001) * 1000));
            }

            // 存储结果
            dataList.push({ index: i, value: result });

            // 应用样式
            const hue = (i * 7.2) % 360;
            item.style.background = `hsla(${hue}, 70%, 60%, 0.5)`;
            item.textContent = (i + 1);

            container.appendChild(item);
        }

        // 排序操作
        dataList.sort((a, b) => b.value - a.value);

        const endTime = performance.now();
        document.getElementById('status').textContent =
            'Loaded in ' + (endTime - startTime).toFixed(2) + 'ms | Total: ' + dataList.length + ' items';
    </script>
</body>
</html>
