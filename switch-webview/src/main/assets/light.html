<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Load</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { text-align: center; }
        .container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .item {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .status { text-align: center; margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Light Load (20 Elements)</h1>
    <div class="container" id="container"></div>
    <div class="status" id="status">Loading...</div>
    <script>
        // Simulate light load: 20 DOM elements with simple calculations
        const container = document.getElementById('container');
        const startTime = performance.now();

        for (let i = 0; i < 20; i++) {
            const item = document.createElement('div');
            item.className = 'item';
            item.textContent = 'Item ' + (i + 1);

            // Light computation
            let result = 0;
            for (let j = 0; j < 1000; j++) {
                result += Math.sin(j * 0.01) * Math.cos(j * 0.01);
            }
            item.style.opacity = 0.7 + (result % 0.3);

            container.appendChild(item);
        }

        const endTime = performance.now();
        document.getElementById('status').textContent =
            'Loaded in ' + (endTime - startTime).toFixed(2) + 'ms';
    </script>
</body>
</html>
