<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium Load</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { text-align: center; }
        .container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .item {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: transform 0.2s;
        }
        .item:hover { transform: scale(1.1); }
        .status { text-align: center; margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .nested { display: flex; flex-direction: column; align-items: center; }
        .nested span { font-size: 8px; opacity: 0.7; }
    </style>
</head>
<body>
    <h1>Medium Load (100 Elements)</h1>
    <div class="container" id="container"></div>
    <div class="status" id="status">Loading...</div>
    <script>
        // Simulate medium load: 100 DOM elements with moderate calculations
        const container = document.getElementById('container');
        const startTime = performance.now();

        // Create data structures
        const dataMap = new Map();
        const dataList = [];

        for (let i = 0; i < 100; i++) {
            const item = document.createElement('div');
            item.className = 'item';

            // Create nested structure
            const nested = document.createElement('div');
            nested.className = 'nested';

            const mainText = document.createElement('div');
            mainText.textContent = i + 1;

            const subText = document.createElement('span');

            // Medium computation
            let result = 0;
            for (let j = 0; j < 5000; j++) {
                result += Math.sin(j * 0.01 + i) * Math.sqrt(j + 1);
            }

            // Store in data structures
            dataMap.set('item_' + i, { value: result, index: i });
            dataList.push({ id: i, computed: result });

            subText.textContent = result.toFixed(1);
            nested.appendChild(mainText);
            nested.appendChild(subText);
            item.appendChild(nested);

            // Apply computed styles
            const hue = (i * 3.6) % 360;
            item.style.background = `hsla(${hue}, 70%, 50%, 0.3)`;

            container.appendChild(item);
        }

        // Sort data
        dataList.sort((a, b) => a.computed - b.computed);

        const endTime = performance.now();
        document.getElementById('status').textContent =
            'Loaded in ' + (endTime - startTime).toFixed(2) + 'ms | ' +
            'Elements: ' + container.children.length;
    </script>
</body>
</html>
