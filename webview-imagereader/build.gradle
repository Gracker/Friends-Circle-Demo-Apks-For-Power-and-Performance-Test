plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wechatfriendforwebviewimagereader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.wechatfriendforwebviewimagereader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE_PATH") ?: "$System.env.HOME/Code/APK-Key/Chris/keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "123456"
            keyAlias System.getenv("KEY_ALIAS") ?: "key0"
            keyPassword System.getenv("KEY_PASSWORD") ?: "123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    maven {
        url "https://maven.mozilla.org/maven2/"
    }
}

dependencies {
    implementation project(':load-config')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // 使用基础 Activity，GeckoView 需要 lifecycle 依赖 (不含 lifecycle-process 避免冲突)
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.7.0'
    implementation 'androidx.core:core:1.12.0'

    // GeckoView - Mozilla Firefox 引擎 (排除传递依赖避免冲突)
    implementation('org.mozilla.geckoview:geckoview-arm64-v8a:133.0.20241202233018') {
        exclude group: 'androidx.lifecycle'
        exclude group: 'androidx.startup'
    }

    // Glide图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // 导入RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

