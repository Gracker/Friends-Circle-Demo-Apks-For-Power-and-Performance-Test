plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wechatfriendfordualwindow'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.wechatfriendfordualwindow"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'] ?: System.getenv('KEYSTORE_FILE_PATH') ?: '../release.keystore')
                storePassword keystoreProperties['storePassword'] ?: System.getenv('STORE_PASSWORD')
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS')
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
            } else {
                storeFile file(System.getenv('KEYSTORE_FILE_PATH') ?: '../release.keystore')
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':load-config')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}

