<!DOCTYPE html>
<html>

<head>
    <title>WebView Load</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        #log {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .dummy {
            width: 10px;
            height: 10px;
            background: red;
            display: inline-block;
        }
    </style>
</head>

<body>
    <h1>Launch WebView</h1>
    <div id="status">Initializing...</div>
    <div id="log"></div>
    <div id="dom-container"></div>
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function log(msg) {
            const div = document.getElementById('log');
            div.innerHTML += msg + "<br/>";
            document.getElementById('status').innerText = msg;
            console.log(msg);
        }

        let seed = 123456789;
        function random() {
            seed = (seed * 1664525 + 1013904223) % 4294967296;
            return (seed >>> 0) / 4294967296;
        }

        async function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function runHeavyDomConstruction(intensity) {
            const container = document.getElementById('dom-container');
            // DOM Construction & Style Recalc
            // Heavy: 20 * 100 = 2000 rows. With 5 cols = 10,000 nodes! 
            // This is a heavy DOM for mobile.
            const rows = intensity * 100; 
            const cols = 5;

            let html = '<table style="width:100%; border-collapse: collapse;">';
            for (let r = 0; r < rows; r++) {
                html += '<tr>';
                for (let c = 0; c < cols; c++) {
                    // Unique classes to stress Style Matching
                    html += `<td class="cell row-${r} col-${c}" style="padding: 5px; border: 1px solid #ccc;">Item ${r},${c}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';

            // 1. Parse HTML & Construct DOM
            container.innerHTML = html;

            // 2. Force Layout / Reflow
            const height = container.offsetHeight; 
            
            // 3. Force Recalculate Style (change root class)
            container.className = 'loaded';
            const width = container.offsetWidth;
        }

        function runJsonStress(intensity) {
            // Create Huge Object
            const obj = [];
            for (let i = 0; i < intensity * 1000; i++) {
                obj.push({ id: i, name: "Item " + i, values: [random(), random(), random()] });
            }
            // Serialize
            const json = JSON.stringify(obj);
            // Parse
            JSON.parse(json);
        }

        async function executeBusinessLogic(type) {
            const items = type === 'HEAVY' ? 50000 : 5000;
            const data = [];
            // Generate
            for (let i = 0; i < items; i++) {
                data.push({
                    id: i,
                    score: random(),
                    category: i % 5 === 0 ? 'A' : 'B'
                });
            }
            // Sort
            data.sort((a, b) => a.score - b.score);
            // Filter
            const filtered = data.filter(item => item.category === 'A');
            // Map
            const mapped = filtered.map(item => item.score * 2);

            console.log("Processed " + items + " items. Result size: " + mapped.length);
            await delay(5); // Simulate async processing break
        }

        async function simulateLoad() {
            const type = getQueryParam('type') || 'LIGHT';
            log("JS Started. Load: " + type);

            let baseLatency = 50;
            if (type === 'MEDIUM') baseLatency = 200;
            if (type === 'HEAVY') baseLatency = 800;

            // 1. Connection
            log("Connecting...");
            const jitter = baseLatency * 0.2 * (random() - 0.5);
            await delay(baseLatency + jitter);

            // 2. Auth / Processing
            log("Authenticating...");
            await delay(type === 'HEAVY' ? 300 : 50);

            // 3. Web-Specific Load (DOM & JSON & Logic)
            log("Parsing Data & Executing Logic...");
            const intensity = type === 'HEAVY' ? 20 : (type === 'MEDIUM' ? 5 : 1);

            // A. Heavy JSON Parsing (Simulate REST API payload)
            if (intensity > 0) {
                runJsonStress(intensity);
            }

            // B. Business Logic (Data transformation, filtering, sorting)
            await executeBusinessLogic(type);

            log("Rendering...");
            if (intensity > 0) {
                // Yield to UI thread to show log
                await delay(10);
                runHeavyDomConstruction(intensity);
            }

            // 4. Data Fetching chunks (Interleaved)
            const chunks = type === 'HEAVY' ? 5 : 2;
            for (let i = 1; i <= chunks; i++) {
                await delay(type === 'HEAVY' ? 100 : 20);
                log("Processing batch " + i + "/" + chunks);
            }

            log("Finished");

            if (window.Android) {
                window.Android.onLoadFinished();
            }
        }

        window.onload = simulateLoad;
    </script>
</body>

</html>
