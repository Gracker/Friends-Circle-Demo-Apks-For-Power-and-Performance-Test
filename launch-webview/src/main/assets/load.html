<!DOCTYPE html>
<html>
<head>
    <title>WebView Load</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #status { font-size: 20px; font-weight: bold; color: #333; }
        #log { margin-top: 10px; color: #666; font-size: 14px; }
        .dummy { width: 10px; height: 10px; background: red; display: inline-block; }
    </style>
</head>
<body>
    <h1>Launch WebView</h1>
    <div id="status">Initializing...</div>
    <div id="log"></div>
    <div id="dom-container"></div>
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function log(msg) {
            const div = document.getElementById('log');
            div.innerHTML += msg + "<br/>";
            document.getElementById('status').innerText = msg;
            console.log(msg);
        }

        let seed = 123456789;
        function random() {
            seed = (seed * 1664525 + 1013904223) % 4294967296;
            return (seed >>> 0) / 4294967296;
        }

        async function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function runDomThrashing(intensity) {
            const container = document.getElementById('dom-container');
            const count = intensity * 100;
            
            // Force Layout Thrashing (Read-Write-Read-Write)
            for(let i=0; i<count; i++) {
                const el = document.createElement('div');
                el.className = 'dummy';
                container.appendChild(el);
                
                // FORCE REFLOW
                const w = container.offsetWidth; 
                el.style.width = (w + 1) + 'px';
            }
            container.innerHTML = ""; // Cleanup
        }

        function runJsonStress(intensity) {
            // Create Huge Object
            const obj = [];
            for(let i=0; i < intensity * 1000; i++) {
                obj.push({id: i, name: "Item " + i, values: [random(), random(), random()]});
            }
            // Serialize
            const json = JSON.stringify(obj);
            // Parse
            JSON.parse(json);
        }

        async function simulateLoad() {
            const type = getQueryParam('type') || 'LIGHT';
            log("JS Started. Load: " + type);

            let baseLatency = 50;
            if (type === 'MEDIUM') baseLatency = 200;
            if (type === 'HEAVY') baseLatency = 800;

            // 1. Connection
            log("Connecting...");
            const jitter = baseLatency * 0.2 * (random() - 0.5);
            await delay(baseLatency + jitter);

            // 2. Auth / Processing
            log("Authenticating...");
            await delay(type === 'HEAVY' ? 300 : 50);

            // 3. Web-Specific Load (DOM & JSON)
            log("Parsing Data...");
            const intensity = type === 'HEAVY' ? 10 : (type === 'MEDIUM' ? 2 : 0);
            if (intensity > 0) {
                 runJsonStress(intensity);
            }
            
            log("Rendering...");
            if (intensity > 0) {
                 // Yield to UI thread to show log
                 await delay(10);
                 runDomThrashing(intensity);
            }

            // 4. Data Fetching chunks (Interleaved)
            const chunks = type === 'HEAVY' ? 5 : 2;
            for (let i = 1; i <= chunks; i++) {
                await delay(type === 'HEAVY' ? 100 : 20);
                log("Processing batch " + i + "/" + chunks);
            }
            
            log("Finished");
            
            if (window.Android) {
                window.Android.onLoadFinished();
            }
        }

        window.onload = simulateLoad;
    </script>
</body>
</html>
