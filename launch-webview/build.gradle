plugins {
    id 'convention.android-app'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.launch.webview'

    defaultConfig {
        applicationId "com.example.launch.webview"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "load"
    productFlavors {
        light {
            dimension "load"
            applicationIdSuffix ".light"
            resValue "string", "app_name", "Web-Light"
        }
        medium {
            dimension "load"
            applicationIdSuffix ".medium"
            resValue "string", "app_name", "Web-Medium"
        }
        heavy {
            dimension "load"
            applicationIdSuffix ".heavy"
            resValue "string", "app_name", "Web-Heavy"
        }
    }
}

dependencies {
    implementation project(':launch-common')
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.webkit
}
