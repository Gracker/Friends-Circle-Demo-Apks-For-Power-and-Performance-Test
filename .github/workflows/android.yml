name: Android CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-home-cache-cleanup: true
      
    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew
      
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        chmod 600 release.keystore
      
    - name: Get version info
      id: version
      run: |
        echo "BUILD_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      
    - name: Setup Android app signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_FILE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: >
        ./gradlew
        :app:assembleRelease
        :wechatfriendforperformance:assembleRelease
        :wechatfriendforpower:assembleRelease
        :wechatfriendforwebview:assembleRelease
        :wechatfriendforcustomscroller:assembleRelease
        :wechatfriendforrenderstress:assembleRelease
        :wechatfriendforsoftwarerender:assembleRelease
        :wechatfriendforcompose:assembleRelease
        :wechatfriendforsurfacemap:assembleRelease
        :wechatfriendforpurerenderthread:assembleRelease
        :wechatfriendfordualwindow:assembleRelease
        :wechatfriendformixedrender:assembleRelease
        :wechatfriendforglmap:assembleRelease
        --parallel
      
    - name: Rename APK files with version info
      run: |
        # Create release directory
        mkdir -p release-apks
        
        # Rename Release APKs
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk "release-apks/HighPerformanceFriendsCircle-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforperformance/build/outputs/apk/release/wechatfriendforperformance-release.apk" ]; then
          cp wechatfriendforperformance/build/outputs/apk/release/wechatfriendforperformance-release.apk "release-apks/WeChatFriendForPerformance-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforpower/build/outputs/apk/release/wechatfriendforpower-release.apk" ]; then
          cp wechatfriendforpower/build/outputs/apk/release/wechatfriendforpower-release.apk "release-apks/WeChatFriendForPower-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforwebview/build/outputs/apk/release/wechatfriendforwebview-release.apk" ]; then
          cp wechatfriendforwebview/build/outputs/apk/release/wechatfriendforwebview-release.apk "release-apks/WeChatFriendForWebView-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforcustomscroller/build/outputs/apk/release/wechatfriendforcustomscroller-release.apk" ]; then
          cp wechatfriendforcustomscroller/build/outputs/apk/release/wechatfriendforcustomscroller-release.apk "release-apks/WeChatFriendForCustomScroller-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforrenderstress/build/outputs/apk/release/wechatfriendforrenderstress-release.apk" ]; then
          cp wechatfriendforrenderstress/build/outputs/apk/release/wechatfriendforrenderstress-release.apk "release-apks/WeChatFriendForRenderStress-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforsoftwarerender/build/outputs/apk/release/wechatfriendforsoftwarerender-release.apk" ]; then
          cp wechatfriendforsoftwarerender/build/outputs/apk/release/wechatfriendforsoftwarerender-release.apk "release-apks/WeChatFriendForSoftwareRender-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforcompose/build/outputs/apk/release/wechatfriendforcompose-release.apk" ]; then
          cp wechatfriendforcompose/build/outputs/apk/release/wechatfriendforcompose-release.apk "release-apks/WeChatFriendForCompose-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforsurfacemap/build/outputs/apk/release/wechatfriendforsurfacemap-release.apk" ]; then
          cp wechatfriendforsurfacemap/build/outputs/apk/release/wechatfriendforsurfacemap-release.apk "release-apks/WeChatFriendForSurfaceMap-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforpurerenderthread/build/outputs/apk/release/wechatfriendforpurerenderthread-release.apk" ]; then
          cp wechatfriendforpurerenderthread/build/outputs/apk/release/wechatfriendforpurerenderthread-release.apk "release-apks/WeChatFriendForPureRenderThread-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendfordualwindow/build/outputs/apk/release/wechatfriendfordualwindow-release.apk" ]; then
          cp wechatfriendfordualwindow/build/outputs/apk/release/wechatfriendfordualwindow-release.apk "release-apks/WeChatFriendForDualWindow-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendformixedrender/build/outputs/apk/release/wechatfriendformixedrender-release.apk" ]; then
          cp wechatfriendformixedrender/build/outputs/apk/release/wechatfriendformixedrender-release.apk "release-apks/WeChatFriendForMixedRender-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "wechatfriendforglmap/build/outputs/apk/release/wechatfriendforglmap-release.apk" ]; then
          cp wechatfriendforglmap/build/outputs/apk/release/wechatfriendforglmap-release.apk "release-apks/WeChatFriendForGLMap-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        # List all generated files
        echo "Generated APK files:"
        ls -la release-apks/
      
    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-apks-${{ steps.version.outputs.BUILD_TIME }}
        path: release-apks/
        retention-days: 30
        
    - name: Create Release (only on push to master)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: auto-build-${{ steps.version.outputs.BUILD_TIME }}
        name: "Auto Build ${{ steps.version.outputs.BUILD_TIME }}"
        body: |
          🚀 **Automated Build Release**
          
          📅 **Build Time**: ${{ steps.version.outputs.BUILD_TIME }}
          🔗 **Commit**: ${{ steps.version.outputs.SHORT_SHA }}
          🌿 **Branch**: ${{ steps.version.outputs.BRANCH_NAME }}
          
          ## 📦 Included APK Files (10 Load Types Supported)
          
          ### 🎯 Release Version (Signed, Production Ready)
          - **HighPerformanceFriendsCircle-release** - Main Application
          - **WeChatFriendForPerformance-release** - Performance Testing (10 load types)
          - **WeChatFriendForPower-release** - Power Consumption Testing
          - **WeChatFriendForWebView-release** - WebView Testing (10 load types)
          - **WeChatFriendForCustomScroller-release** - Custom Scroller Testing (10 load types)
          - **WeChatFriendForRenderStress-release** - RenderThread Stress Testing (10 load types)
          - **WeChatFriendForSoftwareRender-release** - Software Rendering Testing (10 load types)
          - **WeChatFriendForCompose-release** - Jetpack Compose Testing (10 load types)
          - **WeChatFriendForSurfaceMap-release** - SurfaceView Map Demo (10 load types)
          - **WeChatFriendForPureRenderThread-release** - Pure RenderThread List (10 load types)
          - **WeChatFriendForDualWindow-release** - Dual Window Rendering (10 load types)
          - **WeChatFriendForMixedRender-release** - Mixed Rendering Demo (10 load types)
          - **WeChatFriendForGLMap-release** - OpenGL ES Map Demo (10 load types)
          
          ## 📝 Notes
          - ✅ Release version, signed with production key
          - ✅ Optimized for better performance and smaller size
          - ✅ All APKs passed automated build and signing verification
          - ✅ Ready for installation and production use
          
          ## 🔧 Installation
          1. Download the APK file
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK file
          
          ---
          💡 This is an automated release generated by GitHub Actions
        files: release-apks/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
