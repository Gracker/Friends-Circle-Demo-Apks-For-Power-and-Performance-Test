name: Android CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-home-cache-cleanup: true
      
    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew
      
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        chmod 600 release.keystore
      
    - name: Get version info
      id: version
      run: |
        echo "BUILD_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      
    - name: Setup Android app signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_FILE_PATH: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: >
        ./gradlew
        :app:assembleRelease
        :aosp-performance:assembleRelease
        :aosp-power:assembleRelease
        :aosp-picasso:assembleRelease
        :aosp-customscroller:assembleRelease
        :aosp-renderstress:assembleRelease
        :aosp-softwarerender:assembleRelease
        :aosp-douyin:assembleRelease
        :aosp-video:assembleRelease
        :aosp-ebook:assembleRelease
        :aosp-purerenderthread:assembleRelease
        :aosp-dualwindow:assembleRelease
        :aosp-mixedrender:assembleRelease
        :compose:assembleRelease
        :webview:assembleRelease
        :webview-surface:assembleRelease
        :webview-texture:assembleRelease
        :webview-imagereader:assembleRelease
        :surface-map:assembleRelease
        :gl-map:assembleRelease
        --parallel
      
    - name: Rename APK files with version info
      run: |
        # Create release directory
        mkdir -p release-apks
        
        # Copy and rename APKs with new naming convention
        # Main app
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          cp app/build/outputs/apk/release/app-release.apk "release-apks/app-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        # AOSP modules
        if [ -f "aosp-performance/build/outputs/apk/release/aosp-performance-release.apk" ]; then
          cp aosp-performance/build/outputs/apk/release/aosp-performance-release.apk "release-apks/aosp-performance-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-power/build/outputs/apk/release/aosp-power-release.apk" ]; then
          cp aosp-power/build/outputs/apk/release/aosp-power-release.apk "release-apks/aosp-power-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-picasso/build/outputs/apk/release/aosp-picasso-release.apk" ]; then
          cp aosp-picasso/build/outputs/apk/release/aosp-picasso-release.apk "release-apks/aosp-picasso-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-customscroller/build/outputs/apk/release/aosp-customscroller-release.apk" ]; then
          cp aosp-customscroller/build/outputs/apk/release/aosp-customscroller-release.apk "release-apks/aosp-customscroller-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-renderstress/build/outputs/apk/release/aosp-renderstress-release.apk" ]; then
          cp aosp-renderstress/build/outputs/apk/release/aosp-renderstress-release.apk "release-apks/aosp-renderstress-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-softwarerender/build/outputs/apk/release/aosp-softwarerender-release.apk" ]; then
          cp aosp-softwarerender/build/outputs/apk/release/aosp-softwarerender-release.apk "release-apks/aosp-softwarerender-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-douyin/build/outputs/apk/release/aosp-douyin-release.apk" ]; then
          cp aosp-douyin/build/outputs/apk/release/aosp-douyin-release.apk "release-apks/aosp-douyin-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-video/build/outputs/apk/release/aosp-video-release.apk" ]; then
          cp aosp-video/build/outputs/apk/release/aosp-video-release.apk "release-apks/aosp-video-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-ebook/build/outputs/apk/release/aosp-ebook-release.apk" ]; then
          cp aosp-ebook/build/outputs/apk/release/aosp-ebook-release.apk "release-apks/aosp-ebook-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-purerenderthread/build/outputs/apk/release/aosp-purerenderthread-release.apk" ]; then
          cp aosp-purerenderthread/build/outputs/apk/release/aosp-purerenderthread-release.apk "release-apks/aosp-purerenderthread-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-dualwindow/build/outputs/apk/release/aosp-dualwindow-release.apk" ]; then
          cp aosp-dualwindow/build/outputs/apk/release/aosp-dualwindow-release.apk "release-apks/aosp-dualwindow-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "aosp-mixedrender/build/outputs/apk/release/aosp-mixedrender-release.apk" ]; then
          cp aosp-mixedrender/build/outputs/apk/release/aosp-mixedrender-release.apk "release-apks/aosp-mixedrender-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        # Compose module
        if [ -f "compose/build/outputs/apk/release/compose-release.apk" ]; then
          cp compose/build/outputs/apk/release/compose-release.apk "release-apks/compose-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        # WebView modules
        if [ -f "webview/build/outputs/apk/release/webview-release.apk" ]; then
          cp webview/build/outputs/apk/release/webview-release.apk "release-apks/webview-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "webview-surface/build/outputs/apk/release/webview-surface-release.apk" ]; then
          cp webview-surface/build/outputs/apk/release/webview-surface-release.apk "release-apks/webview-surface-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "webview-texture/build/outputs/apk/release/webview-texture-release.apk" ]; then
          cp webview-texture/build/outputs/apk/release/webview-texture-release.apk "release-apks/webview-texture-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "webview-imagereader/build/outputs/apk/release/webview-imagereader-release.apk" ]; then
          cp webview-imagereader/build/outputs/apk/release/webview-imagereader-release.apk "release-apks/webview-imagereader-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        # Surface and GL modules
        if [ -f "surface-map/build/outputs/apk/release/surface-map-release.apk" ]; then
          cp surface-map/build/outputs/apk/release/surface-map-release.apk "release-apks/surface-map-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        if [ -f "gl-map/build/outputs/apk/release/gl-map-release.apk" ]; then
          cp gl-map/build/outputs/apk/release/gl-map-release.apk "release-apks/gl-map-release-${{ steps.version.outputs.BUILD_TIME }}-${{ steps.version.outputs.SHORT_SHA }}.apk"
        fi
        
        # List all generated files
        echo "Generated APK files:"
        ls -la release-apks/
      
    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-apks-${{ steps.version.outputs.BUILD_TIME }}
        path: release-apks/
        retention-days: 30
        
    - name: Create Release (only on push to master)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: auto-build-${{ steps.version.outputs.BUILD_TIME }}
        name: "Auto Build ${{ steps.version.outputs.BUILD_TIME }}"
        body: |
          🚀 **Automated Build Release**
          
          📅 **Build Time**: ${{ steps.version.outputs.BUILD_TIME }}
          🔗 **Commit**: ${{ steps.version.outputs.SHORT_SHA }}
          🌿 **Branch**: ${{ steps.version.outputs.BRANCH_NAME }}
          
          ## 📦 Included APK Files (20 Modules)
          
          ### 🎯 AOSP Modules (Standard Android UI + RenderThread)
          - **app** - Main Application
          - **aosp-performance** - Performance Testing
          - **aosp-power** - Power Consumption Testing
          - **aosp-picasso** - Picasso Image Loading
          - **aosp-customscroller** - Custom Scroller Testing
          - **aosp-renderstress** - RenderThread Stress Testing
          - **aosp-softwarerender** - Software Rendering Testing
          - **aosp-douyin** - Douyin-style Video Scrolling
          - **aosp-video** - Video Feed Testing
          - **aosp-ebook** - E-Book Reader Demo
          - **aosp-purerenderthread** - Pure RenderThread List
          - **aosp-dualwindow** - Dual Window Rendering
          - **aosp-mixedrender** - Mixed Rendering Demo
          
          ### 🎨 Compose Module
          - **compose** - Jetpack Compose Implementation
          
          ### 🌐 WebView Modules
          - **webview** - Standard WebView
          - **webview-surface** - WebView with SurfaceView
          - **webview-texture** - WebView with TextureView
          - **webview-imagereader** - WebView with ImageReader
          
          ### 🗺️ Surface & GL Modules
          - **surface-map** - SurfaceView Map Demo
          - **gl-map** - OpenGL ES Map Demo
          
          ## 📝 Notes
          - ✅ Release version, signed with production key
          - ✅ Optimized for better performance and smaller size
          - ✅ All APKs passed automated build and signing verification
          - ✅ Ready for installation and production use
          
          ## 🔧 Installation
          1. Download the APK file
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK file
          
          ---
          💡 This is an automated release generated by GitHub Actions
        files: release-apks/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
