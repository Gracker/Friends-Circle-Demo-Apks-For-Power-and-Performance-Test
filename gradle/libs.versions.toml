# Build tools
agp = "8.7.3"
kotlin = "2.0.21"
hilt = "2.51.1"
tracefix = "0.1.0"

# AndroidX
appcompat = "1.7.1"
core-ktx = "1.15.0"
core = "1.15.0"
annotation = "1.9.1"
constraintlayout = "2.2.1"
