viewpager2 = "1.1.0"
webkit = "1.14.0"
tracing = "1.3.0-alpha02"
activity-compose = "1.9.3"
navigation-compose = "2.8.5"

# Lifecycle
lifecycle = "2.8.7"

# Room
room = "2.6.1"

# Compose
compose-bom = "2024.12.01"

# Material
material = "1.12.0"

# Media
media3 = "1.5.1"

# Image loading
glide = "4.16.0"
